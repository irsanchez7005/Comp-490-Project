{% for notification in updates %}
<li class="notification-item{% if not notification.is_read %} is-unread{% endif %}">
  <form method="post" action="{% url 'notifications:mark_read' notification.pk %}" data-notification-read>
    {% csrf_token %}
    <button class="notification-row" type="submit">
      <span class="notification-icon{% if notification.event_type == 'booking_cancelled' %} is-cancelled{% endif %}" aria-hidden="true">
        {% if notification.event_type == 'booking_cancelled' %}&times;{% else %}&#10003;{% endif %}
      </span>
      <span class="notification-body">
        <span class="notification-title">{{ notification.title }}</span>
        {% if not notification.is_read %}<span class="notification-unread">Unread</span>{% endif %}
        <span class="notification-message">{{ notification.message }}</span>
        <time datetime="{{ notification.created_at|date:'c' }}">{{ notification.created_at|date:"M j, Y" }} at {{ notification.created_at|time:"g:i A" }} {{ notification.created_at|date:"T" }}</time>
      </span>
    </button>
  </form>
</li>
{% endfor %}
