{% extends "accounts/base.html" %}
{% block content %}
  {% if validlink %}
    <h1>Set a new password</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save password</button>
    </form>
  {% else %}
    <h1>Link expired</h1>
    <p>That reset link is invalid or already used. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>
  {% endif %}
{% endblock %}
